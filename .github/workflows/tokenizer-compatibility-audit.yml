name: IndetBench tokenizer compatibility audit (no inference)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tokenizer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - model_key: tinyllama11
            model_id: TinyLlama/TinyLlama-1.1B-Chat-v1.0
            revision: fe8a4ea1ffedaf415f4da2f062534de366a451e6
          - model_key: qwen05
            model_id: Qwen/Qwen2.5-0.5B-Instruct
            revision: 7ae557604adf67be50417f59c2c2f167def9a775
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tokenizer only
        run: python -m pip install 'transformers==4.57.1' 'tokenizers'
      - name: Record first-token collisions without changing method
        run: |
          python tests/integration/audit_label_tokenizer.py --model-id '${{ matrix.model_id }}' --revision '${{ matrix.revision }}' --output 'tokenizer_${{ matrix.model_key }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: tokenizer-audit-${{ matrix.model_key }}
          path: tokenizer_${{ matrix.model_key }}.json
          retention-days: 14
