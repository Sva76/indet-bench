[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indetbench"
version = "0.0.1.dev0"
description = "Benchmark primitives for answer determinability in language models"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "PolyForm-Noncommercial-1.0.0"}
authors = [{name = "Simona Vargiu"}]
keywords = ["language-models", "uncertainty", "answerability", "benchmark"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: Other/Proprietary License",
]

[project.optional-dependencies]
replay = ["numpy>=1.26"]
hf = ["torch>=2.2", "transformers>=4.56,<6", "accelerate>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
